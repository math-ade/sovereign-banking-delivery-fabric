apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-banking-deployment
  labels:
    tier: financial-core
spec:
  replicas: 3
  selector:
    matchLabels:
      tier: financial-core
  template:
    metadata:
      labels:
        tier: financial-core
    spec:
      containers:
      - name: banking-vault-worker
        image: sovereign-banking:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: banking-ingress-loadbalancer
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 32500
  selector:
    tier: financial-core
